<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDF Studio Pro + AI Suite</title>
  
  <!-- PDF.js para Renderização -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  
  <!-- FontAwesome Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-dark: #151d30;
      --card-dark: #1e293b;
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* BARRA DE NAVEGAÇÃO RESPONSIVA */
    nav.main-nav {
      background: var(--panel-dark); border-bottom: 1px solid var(--border-color); padding: 0 15px;
      display: flex; justify-content: space-between; align-items: center; height: 55px; flex-shrink: 0; z-index: 1000;
    }
    .nav-brand { font-size: 1rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .nav-tabs { display: flex; gap: 2px; }
    .nav-tab-btn {
      background: transparent; color: var(--text-muted); border: none; padding: 16px 10px; font-weight: 600;
      cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; font-size: 0.8rem;
    }
    .nav-tab-btn:hover, .nav-tab-btn.active { color: var(--text-main); border-bottom-color: var(--accent); }

    .app-screen { display: none; flex: 1; overflow-y: auto; }
    .app-screen.active { display: flex; }

    /* TELA: MEUS DOCUMENTOS */
    #screen-docs { padding: 20px; flex-direction: column; max-width: 1100px; margin: 0 auto; width: 100%; }
    .screen-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 10px 16px;
      border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem;
    }
    .btn-icon {
      background: var(--card-dark); color: var(--text-main); border: 1px solid var(--border-color);
      padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-icon:hover, .btn-icon.active { background: var(--accent); color: white; border-color: var(--accent); }

    .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .doc-card {
      background: var(--panel-dark); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px;
      display: flex; flex-direction: column; gap: 8px; position: relative; transition: 0.2s; cursor: pointer;
    }
    .doc-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .doc-card-header { display: flex; justify-content: space-between; align-items: center; }
    .doc-icon { font-size: 1.8rem; color: #ef4444; }
    .doc-title { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* TELA: QUESTIONÁRIOS */
    #screen-quiz { padding: 20px; flex-direction: column; max-width: 850px; margin: 0 auto; width: 100%; }
    .quiz-card { background: var(--panel-dark); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-control { width: 100%; background: var(--card-dark); border: 1px solid var(--border-color); color: white; padding: 8px 10px; border-radius: 6px; font-size: 0.9rem; }

    .quiz-item { background: var(--panel-dark); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 12px; }
    .quiz-option {
      background: var(--card-dark); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 6px;
      margin-top: 6px; cursor: pointer; transition: 0.2s; font-size: 0.85rem;
    }
    .quiz-option:hover { border-color: var(--accent); }
    .quiz-option.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); }
    .quiz-option.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); }

    /* TELA: LEITOR DE PDF */
    #screen-reader { flex-direction: column; height: calc(100vh - 55px); }
    .reader-toolbar {
      background: var(--panel-dark); border-bottom: 1px solid var(--border-color); padding: 6px 10px;
      display: flex; justify-content: space-between; align-items: center; z-index: 10; flex-shrink: 0; gap: 5px; flex-wrap: wrap;
    }
    .reader-workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
    
    #viewer-container { 
      flex: 1; overflow-y: auto; position: relative; background: #070a12; 
      display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 20px;
    }
    
    .pdf-page-wrapper { 
      position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.8); background: white; 
      display: flex; justify-content: center; align-items: center;
    }
    
    .pdf-page-inner { 
      position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; 
    }
    
    .pdf-page-inner canvas { 
      display: block; 
      max-width: 100%; 
      height: auto !important; 
    }
    
    .drawing-canvas { 
      position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none; 
      width: 100%; height: 100%; 
    }
    .drawing-canvas.active { pointer-events: auto; touch-action: none; }
    
    .textLayer { 
      position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; 
      opacity: 0.2; line-height: 1.0; z-index: 3; pointer-events: auto !important; 
      -webkit-user-select: text; user-select: text;
    }
    .textLayer > span { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }

    /* MODO LIVRO EXCLUSIVO PARA CELULAR (Telas <= 768px) */
    @media (max-width: 768px) {
      #viewer-container { 
        overflow: hidden; padding: 0; justify-content: center; align-items: center; 
      }
      .pdf-page-wrapper { 
        position: absolute; display: none; width: 100% !important; height: 100% !important; max-height: 100%; justify-content: center; align-items: center; 
      }
      .pdf-page-wrapper.active-page { display: flex; }
      .pdf-page-inner canvas { 
        max-height: calc(100vh - 120px); 
        width: auto !important; 
        object-fit: contain; 
      }
      .nav-brand span { display: none; }
      .nav-tab-btn { padding: 16px 8px; font-size: 0.75rem; }
      .reader-toolbar { padding: 4px 6px; justify-content: center; }
      .reader-toolbar > div { gap: 4px; }
      .btn-icon { padding: 5px 8px; font-size: 0.72rem; }
      #current-doc-name { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #sidebar { width: 100%; }
    }

    /* SIDEBAR RESPONSIVA */
    #sidebar {
      width: 290px; background: var(--panel-dark); border-left: 1px solid var(--border-color);
      display: flex; flex-direction: column; transition: transform 0.3s ease; position: absolute; right: 0; top: 0; bottom: 0; z-index: 100;
      transform: translateX(100%);
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border-color); }
    .sb-tab { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600; font-size: 0.78rem; }
    .sb-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    .sidebar-body { flex: 1; overflow-y: auto; padding: 10px; }

    .hl-card, .ai-card { background: var(--card-dark); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 0.8rem; }
    .hl-card { border-left: 3px solid #facc15; }
    .ai-card { border-left: 3px solid var(--accent); }

    /* POPOVER SELEÇÃO DE TEXTO */
    #selection-popover {
      position: absolute; display: none; background: #1e293b; border: 1px solid var(--border-color);
      border-radius: 6px; padding: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 999; gap: 4px;
    }
    #selection-popover button { background: transparent; border: none; color: white; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; }
    #selection-popover button:hover { background: var(--accent); }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
  <nav class="main-nav">
    <div class="nav-brand"><i class="fa-solid fa-graduation-cap"></i> <span>PDF Studio Pro</span></div>
    <div class="nav-tabs">
      <button class="nav-tab-btn active" id="tab-btn-docs" onclick="switchTab('docs')"><i class="fa-solid fa-folder-open"></i> Documentos</button>
      <button class="nav-tab-btn" id="tab-btn-quiz" onclick="switchTab('quiz')"><i class="fa-solid fa-list-check"></i> Simulados IA</button>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn-icon" onclick="exportNotes()" title="Exportar Notas"><i class="fa-solid fa-file-export"></i></button>
    </div>
  </nav>

  <!-- TELA 1: MEUS DOCUMENTOS -->
  <div id="screen-docs" class="app-screen active">
    <div class="screen-header">
      <div>
        <h2>Meus Documentos</h2>
        <p style="color:var(--text-muted); font-size:0.8rem;">Carregue e organize seus PDFs para estudo</p>
      </div>
      <label class="btn-primary">
        <i class="fa-solid fa-plus"></i> Abrir PDF
        <input type="file" id="pdf-input" accept="application/pdf" style="display:none;">
      </label>
    </div>
    <div class="doc-grid" id="doc-grid"></div>
  </div>

  <!-- TELA 2: QUESTIONÁRIOS POR IA -->
  <div id="screen-quiz" class="app-screen">
    <h2>Gerador de Simulados & Questionários</h2>
    <p style="color:var(--text-muted); font-size:0.8rem; margin-bottom:12px;">A IA criará questões baseadas no conteúdo do PDF ativo.</p>
    
    <div class="quiz-card">
      <div class="form-group">
        <label>Documento Ativo:</label>
        <input type="text" id="quiz-doc-name" class="form-control" value="Nenhum PDF aberto" readonly>
      </div>
      <div style="display:flex; gap:8px;">
        <div class="form-group" style="flex:1;">
          <label>Questões:</label>
          <select id="quiz-count" class="form-control">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;">
          <label>Nível:</label>
          <select id="quiz-difficulty" class="form-control">
            <option value="Concurso Público" selected>Concurso</option>
            <option value="Superior">Superior</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" style="width:100%; justify-content:center; margin-top:8px;" onclick="generateQuiz()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Gerar Simulado
      </button>
    </div>

    <div id="quiz-results"></div>
  </div>

  <!-- TELA 3: LEITOR DE PDF -->
  <div id="screen-reader" class="app-screen">
    <div class="reader-toolbar">
      <div style="display:flex; align-items:center; gap:6px;">
        <button class="btn-icon" onclick="switchTab('docs')"><i class="fa-solid fa-arrow-left"></i></button>
        <span id="current-doc-name" style="font-weight:600; font-size:0.8rem;">Documento</span>
      </div>

      <div style="display:flex; align-items:center; gap:4px;">
        <button class="btn-icon active" id="tool-select" onclick="setTool('select')"><i class="fa-solid fa-arrow-pointer" title="Selecionar"></i></button>
        <button class="btn-icon" id="tool-pen" onclick="setTool('pen')"><i class="fa-solid fa-pen" title="Caneta"></i></button>
        <button class="btn-icon" id="tool-highlighter" onclick="setTool('highlighter')"><i class="fa-solid fa-highlighter" title="Marcador"></i></button>
        <button class="btn-icon" id="tool-eraser" onclick="setTool('eraser')"><i class="fa-solid fa-eraser" title="Borracha"></i></button>
        <input type="color" id="pen-color" value="#ef4444" style="border:none; background:none; width:22px; height:22px; cursor:pointer;" title="Cor">
      </div>

      <div style="display:flex; align-items:center; gap:4px;">
        <button class="btn-icon" onclick="downloadCurrentPDF()" title="Baixar PDF Atual"><i class="fa-solid fa-download"></i></button>
        <button class="btn-icon" onclick="toggleSidebar()"><i class="fa-solid fa-bookmark"></i> <span id="hl-count">0</span></button>
      </div>
    </div>

    <div class="reader-workspace">
      <div id="viewer-container"></div>

      <aside id="sidebar">
        <div class="sidebar-tabs">
          <button class="sb-tab active" id="tab-btn-hl" onclick="switchSidebarTab('hl')">Destaques</button>
          <button class="sb-tab" id="tab-btn-ai" onclick="switchSidebarTab('ai')">Chat IA</button>
        </div>
        <div class="sidebar-body" id="sidebar-content"></div>
      </aside>
    </div>
  </div>

  <!-- MENU POPOVER DE SELEÇÃO DE TEXTO -->
  <div id="selection-popover">
    <button onclick="createHighlight()"><i class="fa-solid fa-highlighter" style="color:#facc15;"></i> Destacar</button>
    <button onclick="askAI('explain')"><i class="fa-solid fa-brain" style="color:#60a5fa;"></i> Explicar</button>
    <button onclick="askAI('summarize')"><i class="fa-solid fa-compress" style="color:#34d399;"></i> Resumir</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentDocName = "";
    let currentDocText = "";
    let pdfDoc = null;
    let totalPages = 0;
    let currentPageNum = 1;
    let pdfArrayBuffer = null;
    let selectedText = "";
    let selectedPageNum = 1;
    let activeTool = 'select';
    let highlights = [];
    let aiNotes = [];
    let loadedDocsList = [];
    let currentSidebarTab = 'hl';
    let db = null;

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("PDFStudioStorage", 1);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains("pdfFiles")) {
            db.createObjectStore("pdfFiles", { keyPath: "name" });
          }
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(); };
        request.onerror = (e) => reject(e);
      });
    };

    const savePDFToDB = async (name, buffer) => {
      if(!db) await initDB();
      const tx = db.transaction("pdfFiles", "readwrite");
      tx.objectStore("pdfFiles").put({ name: name, buffer: buffer });
    };

    const getPDFFromDB = async (name) => {
      if(!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction("pdfFiles", "readonly");
        const req = tx.objectStore("pdfFiles").get(name);
        req.onsuccess = () => resolve(req.result ? req.result.buffer : null);
        req.onerror = () => resolve(null);
      });
    };

    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      loadedDocsList = JSON.parse(localStorage.getItem('pdf_docs_list') || '[]');
      renderDocsGrid();
    });

    function switchTab(tab) {
      document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
      
      if(tab === 'docs') {
        document.getElementById('screen-docs').classList.add('active');
        document.getElementById('tab-btn-docs').classList.add('active');
      } else if(tab === 'quiz') {
        document.getElementById('screen-quiz').classList.add('active');
        document.getElementById('tab-btn-quiz').classList.add('active');
        document.getElementById('quiz-doc-name').value = currentDocName || "Nenhum PDF aberto";
      }
    }

    document.getElementById('pdf-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      currentDocName = file.name;
      pdfArrayBuffer = await file.arrayBuffer();
      
      await savePDFToDB(currentDocName, pdfArrayBuffer);

      if(!loadedDocsList.includes(file.name)) {
        loadedDocsList.push(file.name);
        localStorage.setItem('pdf_docs_list', JSON.stringify(loadedDocsList));
      }
      
      renderDocsGrid();
      openCurrentDoc(currentDocName);
    });

    function renderDocsGrid() {
      const grid = document.getElementById('doc-grid');
      grid.innerHTML = '';
      
      if(loadedDocsList.length === 0) {
        grid.innerHTML = `<p style="color:var(--text-muted); grid-column:1/-1;">Nenhum documento aberto ainda. Clique em "Abrir PDF" para começar!</p>`;
        return;
      }

      loadedDocsList.forEach(name => {
        const card = document.createElement('div');
        card.className = 'doc-card';
        card.onclick = () => openCurrentDoc(name);
        card.innerHTML = `
          <div class="doc-card-header">
            <i class="fa-solid fa-file-pdf doc-icon"></i>
            <button style="background:none; border:none; color:red; cursor:pointer;" onclick="deleteDoc(event, '${name}')">✕</button>
          </div>
          <div class="doc-title">${name}</div>
        `;
        grid.appendChild(card);
      });
    }

    async function deleteDoc(e, name) {
      e.stopPropagation();
      loadedDocsList = loadedDocsList.filter(d => d !== name);
      localStorage.setItem('pdf_docs_list', JSON.stringify(loadedDocsList));
      
      if(db) {
        const tx = db.transaction("pdfFiles", "readwrite");
        tx.objectStore("pdfFiles").delete(name);
      }
      renderDocsGrid();
    }

    async function openCurrentDoc(docName) {
      currentDocName = docName || currentDocName;
      pdfArrayBuffer = await getPDFFromDB(currentDocName);

      if(!pdfArrayBuffer) {
        alert("O arquivo PDF salvo não foi encontrado. Por favor, abra-o novamente.");
        return;
      }

      document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-reader').classList.add('active');
      document.getElementById('current-doc-name').textContent = `${currentDocName} (Pág 1)`;

      highlights = JSON.parse(localStorage.getItem(`hl_${currentDocName}`) || '[]');
      updateHighlightsList();

      pdfDoc = await pdfjsLib.getDocument({ data: pdfArrayBuffer.slice(0) }).promise;
      totalPages = pdfDoc.numPages;
      currentPageNum = 1;
      
      const container = document.getElementById('viewer-container');
      container.innerHTML = '';
      currentDocText = "";

      for (let i = 1; i <= totalPages; i++) {
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: 1.5 });

        const wrapper = document.createElement('div');
        wrapper.className = `pdf-page-wrapper ${i === 1 ? 'active-page' : ''}`;
        wrapper.dataset.page = i;

        const inner = document.createElement('div');
        inner.className = 'pdf-page-inner';

        const canvas = document.createElement('canvas');
        canvas.height = viewport.height; 
        canvas.width = viewport.width;
        inner.appendChild(canvas);

        const drawCanvas = document.createElement('canvas');
        drawCanvas.className = 'drawing-canvas';
        drawCanvas.height = viewport.height; 
        drawCanvas.width = viewport.width;
        setupDrawing(drawCanvas, i);
        inner.appendChild(drawCanvas);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

        const textContent = await page.getTextContent();
        currentDocText += textContent.items.map(item => item.str).join(' ') + '\n';

        const textLayer = document.createElement('div');
        textLayer.className = 'textLayer';
        inner.appendChild(textLayer);
        await pdfjsLib.renderTextLayer({ textContentSource: textContent, container: textLayer, viewport: viewport, textDivs: [] }).promise;

        wrapper.appendChild(inner);
        container.appendChild(wrapper);
      }
      
      setTool('select');
    }

    function goToPage(pageNum) {
      if (pageNum < 1 || pageNum > totalPages) return;
      currentPageNum = pageNum;
      document.getElementById('current-doc-name').textContent = `${currentDocName} (Pág ${currentPageNum}/${totalPages})`;
      
      const isMobile = window.innerWidth <= 768;
      if (isMobile) {
        document.querySelectorAll('.pdf-page-wrapper').forEach(w => {
          if (parseInt(w.dataset.page) === currentPageNum) {
            w.classList.add('active-page');
          } else {
            w.classList.remove('active-page');
          }
        });
      } else {
        const targetPage = document.querySelector(`.pdf-page-wrapper[data-page="${currentPageNum}"]`);
        if (targetPage) targetPage.scrollIntoView({ behavior: 'smooth' });
      }
      document.getElementById('selection-popover').style.display = 'none';
    }

    function nextPage() { goToPage(currentPageNum + 1); }
    function prevPage() { goToPage(currentPageNum - 1); }

    function setTool(tool) {
      activeTool = tool;
      document.querySelectorAll('.reader-toolbar .btn-icon').forEach(btn => btn.classList.remove('active'));
      const btnMap = { select: 'tool-select', pen: 'tool-pen', highlighter: 'tool-highlighter', eraser: 'tool-eraser' };
      if(btnMap[tool]) document.getElementById(btnMap[tool])?.classList.add('active');

      document.querySelectorAll('.pdf-page-wrapper').forEach(wrapper => {
        const canvas = wrapper.querySelector('.drawing-canvas');
        const textLayer = wrapper.querySelector('.textLayer');
        
        if (canvas && textLayer) {
          if (tool === 'select') {
            canvas.classList.remove('active');
            canvas.style.pointerEvents = 'none';
            textLayer.style.pointerEvents = 'auto';
          } else {
            canvas.classList.add('active');
            canvas.style.pointerEvents = 'auto';
            textLayer.style.pointerEvents = 'none';
          }
        }
      });
    }

    document.addEventListener('mouseup', (e) => {
      if (activeTool !== 'select') return;
      const selection = window.getSelection();
      const text = selection.toString().trim();
      const popover = document.getElementById('selection-popover');

      if (text.length > 0) {
        selectedText = text;
        const pageWrapper = selection.getRangeAt(0).startContainer.parentElement?.closest('.pdf-page-wrapper');
        selectedPageNum = pageWrapper ? parseInt(pageWrapper.dataset.page) : currentPageNum;

        popover.style.top = `${e.pageY - 45}px`;
        popover.style.left = `${e.pageX - 50}px`;
        popover.style.display = 'flex';
      } else {
        popover.style.display = 'none';
      }
    });

    document.addEventListener('touchend', (e) => {
      if (activeTool !== 'select') return;
      setTimeout(() => {
        const selection = window.getSelection();
        const text = selection ? selection.toString().trim() : "";
        const popover = document.getElementById('selection-popover');
        if (text.length > 0) {
          selectedText = text;
          const touch = e.changedTouches[0];
          popover.style.top = `${touch.pageY - 55}px`;
          popover.style.left = `${Math.min(touch.pageX - 60, window.innerWidth - 180)}px`;
          popover.style.display = 'flex';
        }
      }, 200);
    });

    function createHighlight() {
      if (!selectedText) return;
      highlights.push({ id: Date.now(), text: selectedText, page: selectedPageNum, comment: '' });
      localStorage.setItem(`hl_${currentDocName}`, JSON.stringify(highlights));
      updateHighlightsList();
      document.getElementById('selection-popover').style.display = 'none';
      window.getSelection().removeAllRanges();
      document.getElementById('sidebar').classList.add('open');
      switchSidebarTab('hl');
    }

    function updateHighlightsList() {
      const container = document.getElementById('sidebar-content');
      document.getElementById('hl-count').textContent = highlights.length;
      if(currentSidebarTab !== 'hl') return;
      container.innerHTML = '';
      highlights.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hl-card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; color:var(--text-muted); font-size:0.7rem; margin-bottom:4px;">
            <span>Página ${h.page}</span>
            <button style="background:none; border:none; color:red; cursor:pointer;" onclick="deleteHl(${h.id})">✕</button>
          </div>
          <p>"${h.text}"</p>
          <input type="text" placeholder="Nota..." value="${h.comment || ''}" oninput="updateComment(${h.id}, this.value)" style="width:100%; background:#0f172a; border:1px solid var(--border-color); color:white; padding:4px; border-radius:4px; margin-top:4px;">
        `;
        container.appendChild(card);
      });
    }

    function deleteHl(id) {
      highlights = highlights.filter(h => h.id !== id);
      localStorage.setItem(`hl_${currentDocName}`, JSON.stringify(highlights));
      updateHighlightsList();
    }

    function updateComment(id, txt) {
      const h = highlights.find(item => item.id === id);
      if(h) { h.comment = txt; localStorage.setItem(`hl_${currentDocName}`, JSON.stringify(highlights)); }
    }

    function setupDrawing(canvas, pageNum) {
      const ctx = canvas.getContext('2d');
      let isDrawing = false;

      const savedDrawing = localStorage.getItem(`draw_${currentDocName}_p${pageNum}`);
      if (savedDrawing) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = savedDrawing;
      }

      function saveCanvasState() {
        localStorage.setItem(`draw_${currentDocName}_p${pageNum}`, canvas.toDataURL());
      }

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function startAction(e) {
        if (activeTool === 'select') return;
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        if (e.type === 'touchstart') e.preventDefault();
      }

      function moveAction(e) {
        if (!isDrawing || activeTool === 'select') return;
        const pos = getPos(e);
        const color = document.getElementById('pen-color').value;

        if (activeTool === 'eraser') {
          ctx.clearRect(pos.x - 30, pos.y - 30, 60, 60);
        } else {
          ctx.strokeStyle = activeTool === 'highlighter' ? color + '55' : color;
          ctx.lineWidth = activeTool === 'highlighter' ? 22 : 5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        }
        if (e.type === 'touchmove') e.preventDefault();
      }

      function endAction() {
        if (isDrawing) {
          isDrawing = false;
          saveCanvasState();
        }
      }

      canvas.addEventListener('mousedown', startAction);
      canvas.addEventListener('mousemove', moveAction);
      canvas.addEventListener('mouseup', endAction);
      canvas.addEventListener('mouseleave', endAction);

      canvas.addEventListener('touchstart', startAction, { passive: false });
      canvas.addEventListener('touchmove', moveAction, { passive: false });
      canvas.addEventListener('touchend', endAction);
    }

    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener('touchstart', (e) => {
      if (window.innerWidth <= 768 && e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (window.innerWidth > 768 || activeTool !== 'select' || e.changedTouches.length === 0) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;
      const screenWidth = window.innerWidth;

      if (Math.abs(diffX) > 50 && Math.abs(diffY) < 100) {
        if (diffX > 0) {
          nextPage();
        } else {
          prevPage();
        }
      } else if (Math.abs(diffX) < 15 && Math.abs(diffY) < 15) {
        if (touchStartX < screenWidth * 0.22) {
          prevPage();
        } else if (touchStartX > screenWidth * 0.78) {
          nextPage();
        }
      }
    }, { passive: true });

    function downloadCurrentPDF() {
      if (!pdfArrayBuffer) {
        alert("Nenhum PDF carregado para baixar.");
        return;
      }
      const blob = new Blob([pdfArrayBuffer], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = currentDocName || "documento.pdf";
      link.click();
    }

    async function fetchAI(promptText) {
      const API_KEY_FIXA = "AQ.Ab8RN6JcWy6Iqq8a1zC_TsF_Obhkh0YGDvcpRGxMFS2JF4HgeQ";
      const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY_FIXA}`;

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });
        const data = await res.json();
        if (data.error) return `Erro IA: ${data.error.message}`;
        return data.candidates[0].content.parts[0].text;
      } catch(e) {
        return "Erro de conexão ao comunicar com a IA.";
      }
    }

    async function askAI(promptType) {
      document.getElementById('selection-popover').style.display = 'none';
      document.getElementById('sidebar').classList.add('open');
      switchSidebarTab('ai');

      const prompt = promptType === 'explain' 
        ? `Explique de forma simples o seguinte trecho: "${selectedText}"`
        : `Faça um resumo direto do seguinte trecho: "${selectedText}"`;

      const container = document.getElementById('sidebar-content');
      const tempId = Date.now();
      container.innerHTML += `<div class="ai-card" id="temp-${tempId}"><strong>🤖 Pensando...</strong></div>`;

      const response = await fetchAI(prompt);
      document.getElementById(`temp-${tempId}`)?.remove();
      
      if(response) {
        aiNotes.push({ prompt: promptType, text: response });
        renderAiNotes();
      }
    }

    function renderAiNotes() {
      const container = document.getElementById('sidebar-content');
      if(currentSidebarTab !== 'ai') return;
      container.innerHTML = '';
      aiNotes.forEach(n => {
        const card = document.createElement('div');
        card.className = 'ai-card';
        card.innerHTML = `<strong>🤖 IA (${n.prompt === 'explain' ? 'Explicação' : 'Resumo'})</strong><p style="margin-top:4px;">${n.text}</p>`;
        container.appendChild(card);
      });
    }

    async function generateQuiz() {
      if(!currentDocText || currentDocText.trim().length < 20) { 
        alert("Abra um PDF legível primeiro!"); 
        return; 
      }

      const count = document.getElementById('quiz-count').value;
      const diff = document.getElementById('quiz-difficulty').value;
      const resultsDiv = document.getElementById('quiz-results');
      resultsDiv.innerHTML = `<p style="color:var(--accent); font-weight:bold;"><i class="fa-solid fa-spinner fa-spin"></i> A IA está criando o simulado...</p>`;

      const prompt = `Você é uma banca examinadora. Com base no texto: "${currentDocText.substring(0, 7000)}", crie exatas ${count} questões de múltipla escolha.
Formato de resposta EXCLUSIVAMENTE em JSON (array de objetos):
[
  {
    "question": "Enunciado",
    "options": ["Opção A", "Opção B", "Opção C", "Opção D"],
    "answerIndex": 0,
    "explanation": "Gabarito comentado."
  }
]`;

      const aiRes = await fetchAI(prompt);
      if(!aiRes) { resultsDiv.innerHTML = `<p style="color:red;">Erro ao obter resposta da IA.</p>`; return; }

      try {
        const cleanJson = aiRes.replace(/```json|```/g, '').trim();
        const questions = JSON.parse(cleanJson);
        
        resultsDiv.innerHTML = '';
        (Array.isArray(questions) ? questions : []).forEach((q, idx) => {
          const qEl = document.createElement('div');
          qEl.className = 'quiz-item';
          qEl.innerHTML = `
            <h4>${idx + 1}. ${q.question}</h4>
            ${q.options.map((opt, i) => `
              <div class="quiz-option" onclick="checkAnswer(this, ${i === q.answerIndex}, '${q.explanation.replace(/'/g, "\\'")}')">
                ${opt}
              </div>
            `).join('')}
            <div class="quiz-exp" style="display:none; margin-top:8px; font-size:0.8rem; color:var(--accent);"></div>
          `;
          resultsDiv.appendChild(qEl);
        });
      } catch(e) {
        resultsDiv.innerHTML = `<p style="color:red;">Erro ao processar as questões da IA. Tente gerar novamente.</p>`;
      }
    }

    function checkAnswer(el, isCorrect, exp) {
      const parent = el.parentElement;
      parent.querySelectorAll('.quiz-option').forEach(o => o.style.pointerEvents = 'none');
      if(isCorrect) el.classList.add('correct');
      else el.classList.add('incorrect');
      const expDiv = parent.querySelector('.quiz-exp');
      expDiv.innerHTML = `<strong>Gabarito:</strong> ${exp}`;
      expDiv.style.display = 'block';
    }

    function exportNotes() {
      if(highlights.length === 0) { alert("Nenhum destaque salvo!"); return; }
      let content = `=== NOTAS DE ESTUDO: ${currentDocName} ===\n\n`;
      highlights.forEach(h => {
        content += `[Página ${h.page}]\nTrecho: "${h.text}"\nNota: ${h.comment || 'Nenhuma'}\n\n`;
      });
      const blob = new Blob([content], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Notas_${currentDocName}.txt`;
      a.click();
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function switchSidebarTab(tab) {
      currentSidebarTab = tab;
      document.getElementById('tab-btn-hl').classList.toggle('active', tab === 'hl');
      document.getElementById('tab-btn-ai').classList.toggle('active', tab === 'ai');
      if(tab === 'hl') updateHighlightsList();
      else renderAiNotes();
    }
  </script>
</body>
